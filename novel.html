<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEART BEAT | இதயத் துடிப்பு</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#100f1b;
 color:white;
 font-family:Arial,sans-serif;
}
header{
 background:#1b1929;
 padding:20px;
 text-align:center;
 border-bottom:1px solid #b99548;
}
header h2{color:#e5bd69;margin:0}
header p{color:#ddd}
.container{
 max-width:850px;
 margin:auto;
 padding:18px;
}
select,input,textarea,button{
 width:100%;
 padding:13px;
 margin:7px 0;
 border-radius:8px;
 border:1px solid #75613c;
 font-size:16px;
}
select,input,textarea{
 background:#211e30;
 color:white;
}
button{
 background:#c49a45;
 color:#160f08;
 font-weight:bold;
 cursor:pointer;
}
.chapter{
 background:#242136;
 color:white;
 border:1px solid #75613c;
 text-align:left;
 margin:5px 0;
}
#reading{
 display:none;
 background:#211e30;
 padding:20px;
 border-radius:10px;
 line-height:2;
 white-space:pre-wrap;
}
#chapterList{margin-top:20px}
#admin{
 background:#211e30;
 padding:15px;
 margin-top:25px;
 border-radius:10px;
}
.small{font-size:13px;color:#ccc}
</style>
</head>

<body>

<header>
<h2>♥ HEART BEAT ♥</h2>
<p>இதயத் துடிப்பு</p>
</header>

<div class="container">

<h2>📚 நாவல் வாசிப்பு</h2>

<select id="novelSelect" onchange="showNovel()">
<option value="0">என் உயிரின் அர்த்தம் நீ தானடி</option>
<option value="1">உயிரே ஒரு வார்த்தை சொல்லடா உனக்காக காத்திருப்பேன்</option>
<option value="2">உயிர்த் தீயின் ஓசை</option>
</select>

<h2 id="novelTitle"></h2>
<p id="novelDescription">HEART BEAT தமிழ் நாவல்கள்</p>

<div id="chapterList"></div>

<div id="reading">
<h2 id="readingTitle"></h2>
<div id="readingContent"></div>
<button onclick="backToChapters()">⬅ அத்தியாயங்களுக்குத் திரும்பு</button>
</div>

<div id="admin">
<h3>✍️ புதிய அத்தியாயம் சேர்க்க</h3>
<p class="small">இந்தப் பகுதி தற்போது இந்த உலாவியில் மட்டும் மாதிரியாகச் செயல்படும். உண்மையான இணையதளச் சேமிப்பு பின்னர் இணைக்கப்பட வேண்டும்.</p>

<input id="newChapterTitle" placeholder="அத்தியாயத்தின் பெயர்">
<textarea id="newChapterContent" rows="8" placeholder="அத்தியாயத்தின் கதையை இங்கே எழுதவும்"></textarea>
<button onclick="addChapter()">அத்தியாயத்தைச் சேர்</button>
</div>

</div>

<script>
const novels=[
"என் உயிரின் அர்த்தம் நீ தானடி",
"உயிரே ஒரு வார்த்தை சொல்லடா உனக்காக காத்திருப்பேன்",
"உயிர்த் தீயின் ஓசை"
];

let chapters=[[],[],[]];

let currentNovel=0;

function showNovel(){
 currentNovel=Number(document.getElementById("novelSelect").value);
 document.getElementById("novelTitle").innerText=novels[currentNovel];
 document.getElementById("reading").style.display="none";
 renderChapters();
}

function renderChapters(){
 const list=document.getElementById("chapterList");
 list.innerHTML="";

 chapters[currentNovel].forEach((chapter,index)=>{
  const button=document.createElement("button");
  button.className="chapter";
  button.innerText=chapter.title;
  button.onclick=()=>readChapter(index);
  list.appendChild(button);
 });

 if(chapters[currentNovel].length===0){
  list.innerHTML="<p>அத்தியாயங்கள் விரைவில் சேர்க்கப்படும்.</p>";
 }
}

function addChapter(){
 const title=document.getElementById("newChapterTitle").value.trim();
 const content=document.getElementById("newChapterContent").value.trim();

 if(!title || !content){
  alert("அத்தியாயத்தின் பெயரையும் கதையையும் எழுதவும்.");
  return;
 }

 chapters[currentNovel].push({title,content});

 document.getElementById("newChapterTitle").value="";
 document.getElementById("newChapterContent").value="";

 renderChapters();
 alert("அத்தியாயம் சேர்க்கப்பட்டது.");
}

function readChapter(index){
 const chapter=chapters[currentNovel][index];
 document.getElementById("readingTitle").innerText=chapter.title;
 document.getElementById("readingContent").innerText=chapter.content;
 document.getElementById("reading").style.display="block";
 window.scrollTo(0,document.getElementById("reading").offsetTop);
}

function backToChapters(){
 document.getElementById("reading").style.display="none";
}

showNovel();
</script>

</body>
</html>
