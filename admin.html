<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sakthisure Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f5;color:#222;font-family:Arial,sans-serif}
button{border:0;border-radius:8px;padding:11px 15px;background:#722b65;color:white;cursor:pointer}
button:disabled{opacity:.5}
.secondary{background:#eee;color:#222}
.danger{background:#b3261e}
.green{background:#167a48}
header{background:#722b65;color:white;padding:16px;display:flex;justify-content:space-between;align-items:center}
header h2{margin:0;font-size:20px}
.wrap{max-width:1200px;margin:auto;padding:16px}
.panel{background:white;padding:18px;border-radius:12px;margin-bottom:16px;box-shadow:0 2px 8px #0000000d}
input,textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;margin:7px 0 14px;background:#fff;color:#222}
textarea{min-height:90px}
label{font-weight:bold;font-size:14px}
.login{max-width:420px;margin:60px auto}
.layout{display:grid;grid-template-columns:280px 1fr;gap:16px}
.novel-item,.chapter-item{padding:12px;border:1px solid #eee;border-radius:8px;margin:8px 0;cursor:pointer}
.novel-item.active,.chapter-item.active{border:2px solid #722b65;background:#fff8fd}
.small{font-size:13px;color:#666}
.actions,.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.hidden{display:none!important}
#editor{min-height:480px;background:#fff;color:#111;border:1px solid #bbb;border-radius:8px;padding:20px;outline:none;line-height:1.9;font-size:18px;white-space:normal}
#editor:empty:before{content:"இங்கே உங்கள் கதையை எழுதத் தொடங்குங்கள்...";color:#999}
#editor img{max-width:100%;height:auto;display:block;margin:14px auto;border-radius:8px}
.toolbar button{background:#eee;color:#222;padding:8px 12px}
.status{font-size:13px;color:#167a48;min-height:20px}
.cover-preview{max-width:130px;max-height:170px;object-fit:cover;border-radius:8px}
@media(max-width:760px){.layout{grid-template-columns:1fr}#editor{min-height:380px;padding:14px;font-size:17px}}
</style>
</head>
<body>

<header>
<h2>🌸 Sakthisure Admin</h2>
<button id="logoutBtn" class="secondary hidden" onclick="logout()">வெளியேறு</button>
</header>

<div id="loginBox" class="panel login">
<h2>Admin Login</h2>
<label>மின்னஞ்சல்</label>
<input id="email" type="email" placeholder="Admin மின்னஞ்சல்">
<label>கடவுச்சொல்</label>
<input id="password" type="password" placeholder="கடவுச்சொல்">
<button onclick="login()">உள்நுழைக</button>
<p id="loginMessage" class="small"></p>
</div>

<div id="dashboard" class="wrap hidden">
<div class="panel">
<h2>🌷 உங்கள் நாவல்கள்</h2>
<button onclick="createNovel()">＋ புதிய நாவல் உருவாக்கு</button>
<div id="novelList"></div>
</div>

<div id="workArea" class="hidden">
<div class="panel">
<h2>📚 நாவல் விவரங்கள்</h2>
<label>நாவல் தலைப்பு</label>
<input id="novelTitle">
<label>நாவல் அறிமுகம்</label>
<textarea id="novelDescription"></textarea>
<label>அட்டைப்பட Emoji</label>
<input id="novelEmoji" value="📚">
<label>அட்டைப்படம் பதிவேற்றம்</label>
<input id="coverFile" type="file" accept="image/*">
<img id="coverPreview" class="cover-preview hidden" alt="அட்டைப்படம்">
<div class="actions">
<button onclick="saveNovel()">விவரங்களைச் சேமி</button>
<button class="green" id="novelPublishBtn" onclick="toggleNovelPublish()">வெளியிடு</button>
<button class="danger" onclick="deleteNovel()">நாவலை நீக்கு</button>
</div>
<p id="novelStatus" class="status"></p>
</div>

<div class="layout">
<div class="panel">
<h3>📖 அத்தியாயங்கள்</h3>
<button onclick="createChapter()">＋ புதிய அத்தியாயம்</button>
<div id="chapterList"></div>
</div>

<div class="panel">
<div id="emptyEditor">
<h3>எழுதத் தொடங்குங்கள்</h3>
<p class="small">புதிய அத்தியாயத்தை உருவாக்கவும் அல்லது ஒன்றைத் தேர்ந்தெடுக்கவும்.</p>
</div>

<div id="chapterEditor" class="hidden">
<label>அத்தியாயத் தலைப்பு</label>
<input id="chapterTitle" placeholder="அத்தியாயத்தின் தலைப்பு">

<div class="toolbar">
<button onclick="formatText('bold')"><b>B</b></button>
<button onclick="formatText('italic')"><i>I</i></button>
<button onclick="formatText('underline')"><u>U</u></button>
<button onclick="formatText('justifyLeft')">இடது</button>
<button onclick="formatText('justifyCenter')">நடுவில்</button>
<button onclick="formatText('insertUnorderedList')">பட்டியல்</button>
<button onclick="formatText('formatBlock','h2')">தலைப்பு</button>
<button onclick="document.getElementById('chapterImage').click()">🖼 படம் சேர்க்க</button>
<input id="chapterImage" type="file" accept="image/*" class="hidden">
</div>

<div id="editor" contenteditable="true" spellcheck="true"></div>
<p id="saveStatus" class="status">சேமிக்கத் தயார்</p>
<div class="actions">
<button onclick="saveChapterNow()">இப்போதே சேமி</button>
<button class="green" onclick="publishChapter()">அத்தியாயத்தை வெளியிடு</button>
<button class="secondary" onclick="unpublishChapter()">Draft ஆக மாற்று</button>
<button class="danger" onclick="deleteChapter()">அத்தியாயத்தை நீக்கு</button>
</div>
<p class="small">நீங்கள் எழுதும் மாற்றங்கள் தானாக Draft ஆகச் சேமிக்கப்படும்.</p>
</div>
</div>
</div>
</div>
</div>

<script>
const SUPABASE_URL="https://wuwjemfaaadqpprwqosx.supabase.co";
const SUPABASE_KEY="sb_publishable_VhC6ZD3rFKRcG_TxKvCa_Q_OJwfvznw";
const ADMIN_ID="6e72b8c3-77e7-4ab5-871b-233035211461";
const IMAGE_BUCKET="ss-story-images";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $=id=>document.getElementById(id);
let currentUser=null,activeNovel=null,activeChapter=null;
let saveTimer=null,saveRunning=false,chapterDirty=false;
let saveAgain=false;

function status(id,text){$(id).textContent=text}
function cleanHTML(html){
 return DOMPurify.sanitize(html||"",{
  USE_PROFILES:{html:true},
  ADD_TAGS:["img"],
  ADD_ATTR:["src","alt","width","height"]
 });
}

async function login(){
 status("loginMessage","உள்நுழைகிறது...");
 const {data,error}=await db.auth.signInWithPassword({
  email:$("email").value.trim(),
  password:$("password").value
 });
 if(error){status("loginMessage","பிழை: "+error.message);return}
 await checkAdmin(data.user);
}

async function checkAdmin(user){
 if(!user||user.id!==ADMIN_ID){
  await db.auth.signOut();
  status("loginMessage","இந்தக் கணக்கிற்கு Admin அனுமதி இல்லை.");
  return;
 }
 currentUser=user;
 $("loginBox").classList.add("hidden");
 $("dashboard").classList.remove("hidden");
 $("logoutBtn").classList.remove("hidden");
 await loadNovels();
}

async function logout(){
 if(activeChapter){
  const ok=await flushChapterSave();
  if(!ok){alert("சேமிக்க முடியவில்லை. மீண்டும் முயற்சிக்கவும்.");return}
 }
 await db.auth.signOut();
 currentUser=null;activeNovel=null;activeChapter=null;
 $("dashboard").classList.add("hidden");
 $("loginBox").classList.remove("hidden");
 $("logoutBtn").classList.add("hidden");
}

db.auth.getSession().then(({data})=>{
 if(data.session) checkAdmin(data.session.user);
});

async function loadNovels(){
 const {data,error}=await db.from("ss_novels").select("*").order("updated_at",{ascending:false});
 if(error){alert("நாவல்களைப் பெற முடியவில்லை: "+error.message);return}
 $("novelList").innerHTML="";
 if(!data.length){$("novelList").textContent="இன்னும் நாவல்கள் இல்லை.";return}
 data.forEach(n=>{
  const item=document.createElement("div");
  item.className="novel-item"+(activeNovel?.id===n.id?" active":"");
  const title=document.createElement("b");
  title.textContent=(n.cover_emoji||"📚")+" "+n.title;
  const state=document.createElement("div");
  state.className="small";
  state.textContent=n.is_published?"வெளியிடப்பட்டது":"Draft";
  item.append(title,state);
  item.onclick=()=>selectNovel(n.id);
  $("novelList").append(item);
 });
}

async function createNovel(){
 const title=prompt("புதிய நாவலின் பெயர்:");
 if(!title?.trim())return;
 const {data,error}=await db.from("ss_novels").insert({
  title:title.trim(),description:"",category:"காதல்",
  cover_emoji:"📚",author_id:currentUser.id,
  author_name:"Sakthisure",is_published:false
 }).select().single();
 if(error){alert("உருவாக்க முடியவில்லை: "+error.message);return}
 await loadNovels();
 await selectNovel(data.id);
}

async function selectNovel(id){
 if(activeChapter){
  const ok=await flushChapterSave();
  if(!ok){alert("முதலில் அத்தியாயத்தைச் சேமிக்கவும்.");return}
 }
 const {data,error}=await db.from("ss_novels").select("*").eq("id",id).single();
 if(error){alert(error.message);return}
 activeNovel=data;activeChapter=null;
 $("workArea").classList.remove("hidden");
 $("novelTitle").value=data.title||"";
 $("novelDescription").value=data.description||"";
 $("novelEmoji").value=data.cover_emoji||"📚";
 if(data.cover_image_url){
  $("coverPreview").src=data.cover_image_url;
  $("coverPreview").classList.remove("hidden");
 }else $("coverPreview").classList.add("hidden");
 $("novelPublishBtn").textContent=data.is_published?"வெளியீட்டை நிறுத்து":"வெளியிடு";
 $("chapterEditor").classList.add("hidden");
 $("emptyEditor").classList.remove("hidden");
 await loadChapters();
 await loadNovels();
}

async function saveNovel(){
 if(!activeNovel)return;
 const {data,error}=await db.from("ss_novels").update({
  title:$("novelTitle").value.trim(),
  description:$("novelDescription").value,
  cover_emoji:$("novelEmoji").value.trim()||"📚",
  updated_at:new Date().toISOString()
 }).eq("id",activeNovel.id).select().single();
 if(error){status("novelStatus","சேமிக்க முடியவில்லை: "+error.message);return}
 activeNovel=data;
 status("novelStatus","நாவல் விவரங்கள் சேமிக்கப்பட்டன ✓");
 await loadNovels();
}

async function uploadImage(file){
 if(!file)return null;
 if(!file.type.startsWith("image/"))throw new Error("படக் கோப்பை மட்டும் தேர்ந்தெடுக்கவும்.");
 if(file.size>5*1024*1024)throw new Error("படம் 5 MB-க்கு குறைவாக இருக்க வேண்டும்.");
 const ext=(file.name.split(".").pop()||"jpg").replace(/[^a-zA-Z0-9]/g,"");
 const path=currentUser.id+"/"+Date.now()+"-"+Math.random().toString(36).slice(2)+"."+ext;
 const {error}=await db.storage.from(IMAGE_BUCKET).upload(path,file,{upsert:false,contentType:file.type});
 if(error)throw error;
 const {data}=db.storage.from(IMAGE_BUCKET).getPublicUrl(path);
 return data.publicUrl;
}

$("coverFile").addEventListener("change",async e=>{
 const file=e.target.files[0];
 if(!file||!activeNovel)return;
 status("novelStatus","அட்டைப்படம் பதிவேற்றப்படுகிறது...");
 try{
  const url=await uploadImage(file);
  const {data,error}=await db.from("ss_novels")
   .update({cover_image_url:url,updated_at:new Date().toISOString()})
   .eq("id",activeNovel.id).select().single();
  if(error)throw error;
  activeNovel=data;
  $("coverPreview").src=url;
  $("coverPreview").classList.remove("hidden");
  status("novelStatus","அட்டைப்படம் சேமிக்கப்பட்டது ✓");
 }catch(err){status("novelStatus","படப் பதிவேற்றப் பிழை: "+err.message)}
 e.target.value="";
});

async function toggleNovelPublish(){
 if(!activeNovel)return;
 const next=!activeNovel.is_published;
 const {data,error}=await db.from("ss_novels").update({
  is_published:next,updated_at:new Date().toISOString()
 }).eq("id",activeNovel.id).select().single();
 if(error){alert(error.message);return}
 activeNovel=data;
 $("novelPublishBtn").textContent=next?"வெளியீட்டை நிறுத்து":"வெளியிடு";
 status("novelStatus",next?"நாவல் வெளியிடப்பட்டது ✓":"நாவல் Draft ஆக மாற்றப்பட்டது");
 await loadNovels();
}

async function deleteNovel(){
 if(!activeNovel||!confirm("இந்த நாவலையும் அதன் அத்தியாயங்களையும் நீக்க வேண்டுமா?"))return;
 if(activeChapter&&!await flushChapterSave()){alert("முதலில் சேமிக்கவும்.");return}
 const {error:e1}=await db.from("ss_chapters").delete().eq("novel_id",activeNovel.id);
 if(e1){alert("அத்தியாயங்களை நீக்க முடியவில்லை: "+e1.message);return}
 const {error:e2}=await db.from("ss_novels").delete().eq("id",activeNovel.id);
 if(e2){alert("நாவலை நீக்க முடியவில்லை: "+e2.message);return}
 activeNovel=null;activeChapter=null;
 $("workArea").classList.add("hidden");
 await loadNovels();
}

async function loadChapters(){
 const {data,error}=await db.from("ss_chapters").select("*")
  .eq("novel_id",activeNovel.id).order("chapter_number",{ascending:true});
 if(error){alert(error.message);return}
 $("chapterList").innerHTML="";
 if(!data.length){$("chapterList").textContent="அத்தியாயங்கள் இல்லை.";return}
 data.forEach(ch=>{
  const item=document.createElement("div");
  item.className="chapter-item"+(activeChapter?.id===ch.id?" active":"");
  const title=document.createElement("b");
  title.textContent=ch.chapter_number+". "+(ch.title||"தலைப்பிடப்படாத அத்தியாயம்");
  const state=document.createElement("div");
  state.className="small";
  state.textContent=ch.is_published?"வெளியிடப்பட்டது":"Draft";
  item.append(title,state);
  item.onclick=()=>selectChapter(ch.id);
  $("chapterList").append(item);
 });
}

async function createChapter(){
 if(!activeNovel)return;
 if(activeChapter&&!await flushChapterSave()){alert("முதலில் சேமிக்கவும்.");return}
 const {data:rows,error:readError}=await db.from("ss_chapters")
  .select("chapter_number").eq("novel_id",activeNovel.id)
  .order("chapter_number",{ascending:false}).limit(1);
 if(readError){alert(readError.message);return}
 const number=rows?.length?rows[0].chapter_number+1:1;
 const {data,error}=await db.from("ss_chapters").insert({
  novel_id:activeNovel.id,chapter_number:number,
  title:"அத்தியாயம் "+number,content:"",
  author_id:currentUser.id,author_name:"Sakthisure",
  is_published:false
 }).select().single();
 if(error){alert("அத்தியாயம் உருவாக்க முடியவில்லை: "+error.message);return}
 await loadChapters();
 await selectChapter(data.id);
}

async function selectChapter(id){
 if(activeChapter&&!await flushChapterSave()){alert("முதலில் சேமிக்கவும்.");return}
 const {data,error}=await db.from("ss_chapters").select("*").eq("id",id).single();
 if(error){alert(error.message);return}
 activeChapter=data;chapterDirty=false;
 $("emptyEditor").classList.add("hidden");
 $("chapterEditor").classList.remove("hidden");
 $("chapterTitle").value=data.title||"";
 $("editor").innerHTML=cleanHTML(data.content||"");
 status("saveStatus",data.is_published?"வெளியிடப்பட்ட அத்தியாயம்":"Draft திறக்கப்பட்டது");
 await loadChapters();
}

function markDirty(){
 if(!activeChapter)return;
 chapterDirty=true;
 status("saveStatus","மாற்றங்கள் உள்ளன — சேமிக்கப்படும்...");
 clearTimeout(saveTimer);
 saveTimer=setTimeout(()=>saveChapterNow(),1200);
}

$("chapterTitle").addEventListener("input",markDirty);
$("editor").addEventListener("input",markDirty);

function formatText(command,value=null){
 $("editor").focus();
 document.execCommand(command,false,value);
 markDirty();
}

async function saveChapterNow(){
 if(!activeChapter||!chapterDirty)return true;
 clearTimeout(saveTimer);
 if(saveRunning){saveAgain=true;return false}
 saveRunning=true;
 let success=true;

 do{
  saveAgain=false;
  const id=activeChapter.id;
  const updates={
   title:$("chapterTitle").value.trim(),
   content:cleanHTML($("editor").innerHTML),
   updated_at:new Date().toISOString()
  };
  chapterDirty=false;
  status("saveStatus","சேமிக்கப்படுகிறது...");
  const {data,error}=await db.from("ss_chapters").update(updates)
   .eq("id",id).select().single();

  if(error){
   chapterDirty=true;
   status("saveStatus","சேமிப்புப் பிழை: "+error.message);
   success=false;
   break;
  }
  if(activeChapter?.id===id)activeChapter=data;
  if(chapterDirty)saveAgain=true;
  if(!chapterDirty)status("saveStatus","Draft சேமிக்கப்பட்டது ✓");
 }while(saveAgain);

 saveRunning=false;
 if(chapterDirty&&!saveTimer)saveTimer=setTimeout(()=>saveChapterNow(),500);
 await loadChapters();
 return success&&!chapterDirty;
}

async function flushChapterSave(){
 clearTimeout(saveTimer);
 if(!activeChapter)return true;
 if(saveRunning){
  await new Promise(resolve=>{
   const check=()=>{
    if(!saveRunning)resolve();
    else setTimeout(check,100);
   };
   check();
  });
 }
 if(chapterDirty)return await saveChapterNow();
 return true;
}

async function publishChapter(){
 if(!activeChapter)return;
 if(!await flushChapterSave()){alert("சேமிக்க முடியவில்லை. மீண்டும் முயற்சிக்கவும்.");return}
 const {data,error}=await db.from("ss_chapters").update({
  is_published:true,updated_at:new Date().toISOString()
 }).eq("id",activeChapter.id).select().single();
 if(error){alert("வெளியிட முடியவில்லை: "+error.message);return}
 activeChapter=data;
 status("saveStatus","அத்தியாயம் வெளியிடப்பட்டது ✓");
 await loadChapters();
}

async function unpublishChapter(){
 if(!activeChapter)return;
 if(!await flushChapterSave()){alert("முதலில் சேமிக்கவும்.");return}
 const {data,error}=await db.from("ss_chapters").update({
  is_published:false,updated_at:new Date().toISOString()
 }).eq("id",activeChapter.id).select().single();
 if(error){alert(error.message);return}
 activeChapter=data;
 status("saveStatus","அத்தியாயம் Draft ஆக மாற்றப்பட்டது");
 await loadChapters();
}

async function deleteChapter(){
 if(!activeChapter||!confirm("இந்த அத்தியாயத்தை நீக்க வேண்டுமா?"))return;
 clearTimeout(saveTimer);
 if(!await flushChapterSave()){alert("முதலில் சேமிக்கவும்.");return}
 const id=activeChapter.id;
 const {error}=await db.from("ss_chapters").delete().eq("id",id);
 if(error){alert("நீக்க முடியவில்லை: "+error.message);return}
 activeChapter=null;
 $("chapterEditor").classList.add("hidden");
 $("emptyEditor").classList.remove("hidden");
 await loadChapters();
}
 
$("chapterImage").addEventListener("change",async e=>{
 const file=e.target.files[0];
 if(!file)return;
 try{
  status("saveStatus","படம் பதிவேற்றப்படுகிறது...");
  const url=await uploadImage(file);
  $("editor").focus();
  document.execCommand("insertImage",false,url);
  markDirty();
  status("saveStatus","படம் சேர்க்கப்பட்டது. சேமிக்கப்படும்...");
 }catch(err){status("saveStatus","படப் பிழை: "+err.message)}
 e.target.value="";
});
</script>
