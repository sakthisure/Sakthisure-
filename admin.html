<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sakthisure Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f7;font-family:Arial,sans-serif;color:#292929}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.topbar{height:60px;background:white;display:flex;align-items:center;padding:0 12px;gap:10px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0001}
.topbar button{border:0;background:none;font-size:23px}
.brand{flex:1;text-align:center;color:#c93636;font-size:21px;font-weight:bold}
.publish{color:#c93636;font-weight:bold}
main{max-width:950px;margin:18px auto;padding:0 12px 30px}
.panel{background:white;border:1px solid #e7e7e7;border-radius:10px;padding:15px;margin-bottom:14px}
h2{font-size:18px;margin:0 0 12px}
label{display:block;font-size:14px;margin:10px 0 5px;color:#555}
input,textarea,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:7px}
textarea{min-height:70px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.action{border:0;border-radius:7px;padding:10px 14px;background:#eee}
.primary{background:#c93636;color:white}
.danger{background:#fff0f0;color:#b32626}
#loginPanel{max-width:430px;margin:8vh auto}
#workPanel{display:none}
#novelForm{display:none}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>div{flex:1;min-width:130px}
.status,.small{font-size:13px;color:#888;margin-top:8px}
.editorPanel{padding:0;overflow:hidden}
.editorHead{padding:12px 15px;border-bottom:1px solid #eee;display:flex;align-items:center}
.editorHead strong{color:#c93636;flex:1}
#chapterTitle{border:0;border-bottom:1px solid #eee;border-radius:0;font-size:19px;padding:15px}
#editor{background:#fff;min-height:58vh;padding:18px;font-size:20px;line-height:1.8;outline:none;overflow-wrap:anywhere}
#editor:empty:before{content:"இங்கே உங்கள் கதையை எழுதத் தொடங்குங்கள்...";color:#aaa}
#editor img{max-width:100%;height:auto}
.wordline{text-align:right;background:#fafafa;padding:10px 15px;color:#777;border-top:1px solid #eee;font-size:14px}
.toolbar{display:flex;justify-content:space-around;align-items:center;gap:2px;padding:6px 4px;background:#f1f1f3;border-top:1px solid #e5e5e5;position:sticky;bottom:0}
.tool{width:32px;height:32px;min-width:32px;border:0;border-radius:6px;background:transparent;font-size:17px;font-weight:bold;display:flex;align-items:center;justify-content:center;padding:0}
.tool:active{background:#ddd}
.italic{font-style:italic}
.under{text-decoration:underline}
.hidden{display:none}
@media(min-width:760px){
#editor{min-height:62vh;padding:28px 38px}
.toolbar{justify-content:center;gap:12px}
.tool{width:34px;height:34px;font-size:18px}
}
</style>
</head>
<body>

<header class="topbar">
<button onclick="location.href='index.html'">‹</button>
<div class="brand">Sakthisure</div>
<button class="publish" onclick="saveChapter(true)">பதிப்பிக்க</button>
<button onclick="saveChapter(false)">💾</button>
<button onclick="document.getElementById('managePanel').scrollIntoView()">☰</button>
</header>

<section id="loginPanel" class="panel">
<h2>🌸 Sakthisure Admin Login</h2>
<label>மின்னஞ்சல்</label>
<input id="email" type="email">
<label>கடவுச்சொல்</label>
<input id="password" type="password">
<div class="actions">
<button class="action primary" onclick="login()">உள்நுழை</button>
</div>
<div id="loginStatus" class="status"></div>
</section>

<main id="workPanel">

<section class="panel" id="managePanel">
<div class="row">
<div>
<label>நாவல்</label>
<select id="novelSelect" onchange="loadChapters()">
<option value="">நாவலைத் தேர்ந்தெடுக்கவும்</option>
</select>
</div>
<div>
<label>அத்தியாயம்</label>
<select id="chapterSelect" onchange="openChapter()">
<option value="">அத்தியாயத்தைத் தேர்ந்தெடுக்கவும்</option>
</select>
</div>
</div>
<div class="actions">
<button class="action primary" onclick="newNovel()">＋ புதிய நாவல்</button>
<button class="action" onclick="newChapter()">＋ புதிய அத்தியாயம்</button>
<button class="action" onclick="loadNovels()">↻ புதுப்பி</button>
<button class="action danger" onclick="logout()">வெளியேறு</button>
</div>
<div id="manageStatus" class="status"></div>
</section>

<section class="panel" id="novelForm">
<h2>நாவல் விவரங்கள்</h2>
<label>நாவல் தலைப்பு</label>
<input id="novelTitle">
<label>விளக்கம்</label>
<textarea id="novelDescription"></textarea>
<label>வகை</label>
<input id="novelCategory">
<label>ஆசிரியர் பெயர்</label>
<input id="novelAuthor" value="Sakthisure">
<div class="actions">
<button class="action primary" onclick="saveNovel()">சேமி</button>
<button class="action" onclick="hideNovelForm()">மூடு</button>
</div>
</section>

<section class="panel">
<label>அத்தியாயத் தலைப்பு</label>
<input id="chapterTitle" placeholder="அத்தியாயத் தலைப்பு">
<div class="small">Word Limit இல்லை – எவ்வளவு வேண்டுமானாலும் எழுதலாம்.</div>
</section>

<section class="panel editorPanel" id="editorPanel">
<div class="editorHead">
<strong>✍️ கதை எழுதும் பகுதி</strong>
<span id="saveState" class="small">சேமிக்கப்படவில்லை</span>
</div>

<div id="editor" contenteditable="true" spellcheck="true"></div>

<div class="wordline">
<span id="wordCount">0 words</span>
</div>

<div class="toolbar">
<button class="tool" title="Undo" onclick="command('undo')">↩</button>
<button class="tool" title="Redo" onclick="command('redo')">↪</button>
<button class="tool" title="Bold" onclick="command('bold')">B</button>
<button class="tool italic" title="Italic" onclick="command('italic')">I</button>
<button class="tool under" title="Underline" onclick="command('underline')">U</button>
<button class="tool" title="Alignment" onclick="alignment()">☰</button>
<button class="tool" title="Image" onclick="document.getElementById('imageFile').click()">▧</button>
<button class="tool" title="Fullscreen" onclick="fullscreen()">⛶</button>
</div>
<input id="imageFile" class="hidden" type="file" accept="image/*" onchange="uploadImage(event)">
</section>

<div class="actions">
<button class="action" onclick="saveChapter(false)">💾 வரைவைச் சேமி</button>
<button class="action primary" onclick="saveChapter(true)">பதிப்பிக்க</button>
<button class="action danger" onclick="deleteChapter()">அத்தியாயத்தை நீக்கு</button>
</div>
</main>

<script>
const SUPABASE_URL="https://wuwjemfaaadqpprwqosx.supabase.co";
const SUPABASE_KEY="sb_publishable_VhC6ZD3rFKRcG_TxKvCa_Q_OJwfvznw";
const ADMIN_ID="6e72b8c3-77e7-4ab5-871b-233035211461";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentNovel=null;
let currentChapter=null;
let alignMode=0;
let saveTimer=null;
const $=id=>document.getElementById(id);

async function login(){
 $("loginStatus").textContent="உள்நுழைகிறது...";
 const {data,error}=await db.auth.signInWithPassword({
  email:$("email").value.trim(),
  password:$("password").value
 });
 if(error){$("loginStatus").textContent=error.message;return}
 if(data.user.id!==ADMIN_ID){
  await db.auth.signOut();
  $("loginStatus").textContent="Admin அனுமதி இல்லை";
  return;
 }
 $("loginPanel").style.display="none";
 $("workPanel").style.display="block";
 await loadNovels();
}

async function logout(){
 await db.auth.signOut();
 location.reload();
}

async function checkSession(){
 const {data}=await db.auth.getSession();
 if(data.session && data.session.user.id===ADMIN_ID){
  $("loginPanel").style.display="none";
  $("workPanel").style.display="block";
  loadNovels();
 }
}

async function loadNovels(){
 $("manageStatus").textContent="ஏற்றப்படுகிறது...";
 const {data,error}=await db.from("ss_novels").select("*").order("updated_at",{ascending:false});
 if(error){$("manageStatus").textContent=error.message;return}
 $("novelSelect").innerHTML='<option value="">நாவலைத் தேர்ந்தெடுக்கவும்</option>';
 (data||[]).forEach(n=>{
  const o=document.createElement("option");
  o.value=n.id;o.textContent=n.title;
  $("novelSelect").appendChild(o);
 });
 $("manageStatus").textContent=(data||[]).length+" நாவல்கள்";
}

async function loadChapters(){
 currentNovel=$("novelSelect").value||null;
 currentChapter=null;
 $("chapterSelect").innerHTML='<option value="">அத்தியாயத்தைத் தேர்ந்தெடுக்கவும்</option>';
 $("chapterTitle").value="";
 $("editor").innerHTML="";
 updateWords();
 if(!currentNovel)return;
 const {data,error}=await db.from("ss_chapters").select("*").eq("novel_id",currentNovel).order("chapter_number");
 if(error){$("manageStatus").textContent=error.message;return}
 (data||[]).forEach(c=>{
  const o=document.createElement("option");
  o.value=c.id;
  o.textContent=(c.chapter_number||"")+" – "+(c.title||"அத்தியாயம்");
  $("chapterSelect").appendChild(o);
 });
 $("manageStatus").textContent=(data||[]).length+" அத்தியாயங்கள்";
}

async function openChapter(){
 const id=$("chapterSelect").value;
 if(!id)return;
 const {data,error}=await db.from("ss_chapters").select("*").eq("id",id).single();
 if(error){alert(error.message);return}
 currentChapter=data.id;
 $("chapterTitle").value=data.title||"";
 $("editor").innerHTML=data.content||"";
 updateWords();
 $("saveState").textContent="ஏற்றப்பட்டது";
}

function newNovel(){
 $("novelForm").style.display="block";
 $("novelTitle").value="";
 $("novelDescription").value="";
 $("novelCategory").value="";
 $("novelAuthor").value="Sakthisure";
}
function hideNovelForm(){$("novelForm").style.display="none"}

async function saveNovel(){
 const title=$("novelTitle").value.trim();
 if(!title){alert("நாவல் தலைப்பு எழுதவும்");return}
 const {data,error}=await db.from("ss_novels").insert({
  title,
  description:$("novelDescription").value,
  category:$("novelCategory").value,
  author_name:$("novelAuthor").value||"Sakthisure",
  author_id:ADMIN_ID
 }).select().single();
 if(error){alert(error.message);return}
 hideNovelForm();
 await loadNovels();
 $("novelSelect").value=data.id;
 await loadChapters();
 alert("நாவல் சேமிக்கப்பட்டது");
}

function newChapter(){
 if(!$("novelSelect").value){alert("முதலில் நாவலைத் தேர்ந்தெடுக்கவும்");return}
 currentNovel=$("novelSelect").value;
 currentChapter=null;
 $("chapterSelect").value="";
 $("chapterTitle").value="";
 $("editor").innerHTML="";
 updateWords();
 $("saveState").textContent="புதிய அத்தியாயம்";
 $("chapterTitle").focus();
}

async function saveChapter(publish=false){
 if(!currentNovel){alert("முதலில் நாவலைத் தேர்ந்தெடுக்கவும்");return}
 const title=$("chapterTitle").value.trim();
 const content=$("editor").innerHTML;
 if(!title){alert("அத்தியாயத் தலைப்பு எழுதவும்");return}
 if(!$("editor").innerText.trim()){alert("கதையை எழுதவும்");return}
 $("saveState").textContent="சேமிக்கிறது...";
 let result;
 if(currentChapter){
  result=await db.from("ss_chapters").update({
   title,content,is_published:publish,
   author_id:ADMIN_ID,author_name:"Sakthisure"
  }).eq("id",currentChapter).select().single();
 }else{
  const {count}=await db.from("ss_chapters").select("id",{count:"exact",head:true}).eq("novel_id",currentNovel);
  result=await db.from("ss_chapters").insert({
   novel_id:currentNovel,
   chapter_number:(count||0)+1,
   title,content,is_published:publish,
   author_id:ADMIN_ID,author_name:"Sakthisure"
  }).select().single();
 }
 if(result.error){
  $("saveState").textContent="சேமிக்கவில்லை";
  alert(result.error.message);
  return;
 }
 currentChapter=result.data.id;
 $("saveState").textContent=publish?"பதிப்பிக்கப்பட்டது":"சேமிக்கப்பட்டது";
 await loadChapters();
 $("chapterSelect").value=currentChapter;
}

async function deleteChapter(){
 if(!currentChapter){alert("அத்தியாயம் தேர்ந்தெடுக்கப்படவில்லை");return}
 if(!confirm("இந்த அத்தியாயத்தை நீக்கவா?"))return;
 const {error}=await db.from("ss_chapters").delete().eq("id",currentChapter);
 if(error){alert(error.message);return}
 currentChapter=null;
 $("chapterTitle").value="";
 $("editor").innerHTML="";
 await loadChapters();
 $("saveState").textContent="நீக்கப்பட்டது";
}

function command(cmd){
 $("editor").focus();
 document.execCommand(cmd,false,null);
 updateWords();
 scheduleAutosave();
}

function alignment(){
 $("editor").focus();
 alignMode=(alignMode+1)%4;
 const values=["left","center","right","justify"];
 $("editor").style.textAlign=values[alignMode];
}

function fullscreen(){
 const el=$("editorPanel");
 if(!document.fullscreenElement)el.requestFullscreen?.();
 else document.exitFullscreen?.();
}

function updateWords(){
 const text=$("editor").innerText.trim();
 const count=text?text.split(/\s+/u).length:0;
 $("wordCount").textContent=count.toLocaleString("en-IN")+" words";
}

function scheduleAutosave(){
 updateWords();
 $("saveState").textContent="மாற்றங்கள் உள்ளன";
 clearTimeout(saveTimer);
 saveTimer=setTimeout(async()=>{
  if(currentNovel && currentChapter && $("chapterTitle").value.trim() && $("editor").innerText.trim()){
   const {error}=await db.from("ss_chapters").update({
    title:$("chapterTitle").value.trim(),
    content:$("editor").innerHTML
   }).eq("id",currentChapter);
   $("saveState").textContent=error?"தானியங்கி சேமிப்பு தோல்வி":"தானாகச் சேமிக்கப்பட்டது";
  }
 },1800);
}

async function uploadImage(event){
 const file=event.target.files[0];
 if(!file)return;
 if(!file.type.startsWith("image/")){alert("படத்தைத் தேர்ந்தெடுக்கவும்");return}
 if(file.size>5*1024*1024){alert("5 MB-க்கு குறைவான படம் தேர்ந்தெடுக்கவும்");return}
 const user=(await db.auth.getUser()).data.user;
 if(!user){alert("மீண்டும் உள்நுழையவும்");return}
 const ext=(file.name.split(".").pop()||"jpg").toLowerCase();
 const path=user.id+"/"+Date.now()+"."+ext;
 $("saveState").textContent="படம் பதிவேற்றப்படுகிறது...";
 const {error}=await db.storage.from("ss-story-images").upload(path,file,{
  upsert:false,contentType:file.type
 });
 if(error){alert(error.message);return}
 const {data}=db.storage.from("ss-story-images").getPublicUrl(path);
 $("editor").focus();
 document.execCommand("insertImage",false,data.publicUrl);
 updateWords();
 scheduleAutosave();
 event.target.value="";
}

$("editor").addEventListener("input",scheduleAutosave);
$("chapterTitle").addEventListener("input",()=>{
 if(currentChapter)scheduleAutosave();
});

checkSession();
</script>
</body>
 </html>
